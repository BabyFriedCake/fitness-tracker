name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Admin API typecheck
        run: pnpm api:typecheck

      - name: Admin API tests
        run: pnpm api:test

      - name: Admin API build
        run: pnpm api:build

      - name: Admin Web build
        run: pnpm admin:build

      - name: Validate public content Compose configuration
        run: |
          cp docker-compose.public-content.env.example .env
          docker compose -f docker-compose.public-content.yml config --quiet
